kind = "web"
previewPath = "/"
title = "Calendário de Vídeos"
version = "1.0.0"
id = "artifacts/video-calendar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21553

[services.development]
run = "pnpm --filter @workspace/video-calendar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-calendar", "run", "build" ]
publicDir = "artifacts/video-calendar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21553"
BASE_PATH = "/"
